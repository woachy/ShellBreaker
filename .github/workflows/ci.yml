name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test on Windows
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install compression tools (WinRAR & Bandizip)
        run: |
          $ErrorActionPreference = "Stop"

          # 1) WinRAR (official installer, fallback to Chocolatey)
          $winrarExe = "C:\Program Files\WinRAR\WinRAR.exe"
          if (-not (Test-Path $winrarExe)) {
            $wrSetup = Join-Path $env:TEMP "winrar-x64-723.exe"
            curl.exe -fsSL --retry 3 --connect-timeout 15 "https://www.rarlab.com/rar/winrar-x64-723.exe" -o $wrSetup
            if ($LASTEXITCODE -eq 0 -and (Test-Path $wrSetup)) {
              Start-Process -FilePath $wrSetup -ArgumentList "/S" -Wait
              Remove-Item $wrSetup -Force -ErrorAction SilentlyContinue
            }
          }
          if (-not (Test-Path $winrarExe)) {
            choco install winrar -y --no-progress
          }
          if (-not (Test-Path $winrarExe)) {
            Write-Error "WinRAR installation failed: $winrarExe not found."
            exit 1
          }
          Write-Host "Installed WinRAR: $winrarExe"

          # 2) Bandizip (official installer avoids Chocolatey checksum drift on floating dl.php?choco)
          $bzExe = "C:\Program Files\Bandizip\bz.exe"
          if (-not (Test-Path $bzExe)) {
            $bzSetup = Join-Path $env:TEMP "bandizipInstall.exe"
            curl.exe -fsSL --retry 3 --connect-timeout 15 "https://www.bandisoft.com/bandizip/dl.php?choco" -o $bzSetup
            if ($LASTEXITCODE -eq 0 -and (Test-Path $bzSetup)) {
              Start-Process -FilePath $bzSetup -ArgumentList "/S" -Wait
              Remove-Item $bzSetup -Force -ErrorAction SilentlyContinue
            }
          }
          if (-not (Test-Path $bzExe)) {
            Write-Warning "Bandizip CLI ($bzExe) not found; continuing with WinRAR and bundled 7-Zip."
          } else {
            Write-Host "Installed Bandizip CLI: $bzExe"
          }
          $global:LASTEXITCODE = 0
        shell: pwsh

      - name: Upgrade pip and install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: |
          pytest -v
