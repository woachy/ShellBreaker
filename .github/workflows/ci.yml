name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test on Windows
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install compression tools (WinRAR & Bandizip)
        run: |
          choco install winrar -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Bandisoft uses a floating latest-release URL (dl.php?choco), so Chocolatey's
          # manifest SHA256 drifts whenever Bandizip updates upstream.
          choco install bandizip -y --no-progress --ignore-checksums
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Bandizip installation failed (exit=$LASTEXITCODE); continuing with WinRAR and bundled 7-Zip."
          }
          $global:LASTEXITCODE = 0
        shell: pwsh

      - name: Upgrade pip and install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: |
          pytest -v
